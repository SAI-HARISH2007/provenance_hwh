[project]
name = "greenlight"
version = "0.1.0"
description = "micro1 Agentic Workflows Hackathon 2026 — agentic workflow with traced, sandboxed, verified execution"
requires-python = ">=3.13"
dependencies = [
    "hindsight-client>=0.10.1",
    "openai>=1.50",
    "python-dotenv>=1.0",
]

[dependency-groups]
dev = ["pytest>=8", "pytest-timeout>=2.3", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/greenlight"]

[tool.pytest.ini_options]
testpaths = ["tests"]
timeout = 120
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
