name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    name: lint + tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install uv
        run: |
          python -m pip install --upgrade pip
          pip install uv

      - name: Cache uv, the venv and pip downloads
        uses: actions/cache@v4
        with:
          path: |
            .venv
            ~/.cache/uv
            ~/.cache/pip
          key: ${{ runner.os }}-py313-uv-${{ hashFiles('uv.lock') }}
          restore-keys: |
            ${{ runner.os }}-py313-uv-

      - name: Verify the lockfile is in sync with pyproject.toml
        run: uv lock --check

      - name: Install dependencies from the lockfile
        run: uv sync --group dev --locked

      - name: Lint (ruff)
        run: uv run ruff check .

      - name: Test (pytest)
        run: uv run pytest -q

      - name: Test with coverage gate
        run: uv run pytest --cov=greenlight --cov-report=term-missing --cov-report=xml --cov-fail-under=60 -q

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.xml
          if-no-files-found: ignore
          retention-days: 7
